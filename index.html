<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2d1d16" />
    <title>成长基地 · 冥想闭环原型</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell" id="app" data-screen="recommendation">
      <div class="room" aria-hidden="true"></div>
      <video class="scene-video" id="sceneVideo" playsinline preload="auto" aria-hidden="true"></video>
      <div class="media-transition" id="mediaTransition" aria-hidden="true"></div>
      <div class="atmosphere" aria-hidden="true"></div>

      <button class="welcome-overlay" id="welcomeOverlay" type="button" aria-label="跳过欢迎动画" hidden>
        <span class="welcome-greeting" id="welcomeGreeting">下午好</span>
        <span class="welcome-streak" aria-hidden="true">
          <img src="./assets/streak.png" alt="" />
          <small>连续坚持</small>
          <strong>18</strong>
          <b>天</b>
        </span>
      </button>

      <header class="app-header">
        <div class="streak" id="streak">
          <img src="./assets/streak.png" alt="" />
          <span>连续坚持第18天</span>
        </div>
        <img class="capsule" src="./assets/capsule.png" alt="小程序菜单" />
      </header>

      <section class="message" id="message" aria-live="polite"></section>
      <section class="timer-panel" id="timerPanel" aria-live="polite"></section>

      <div class="reward-layer" id="rewardLayer">
        <button
          class="claim-reward"
          id="claimReward"
          type="button"
          data-action="claim-reward"
          aria-label="点击领取静心帐篷"
          hidden
        >
          <img src="./assets/reward-bed.png" alt="" />
          <span class="claim-label">点击领取</span>
        </button>
        <button class="reward-object" id="rewardObject" data-action="object-detail" aria-label="查看静心帐篷的获得记录">
          <span>NEW</span>
          <img src="./assets/reward-bed.png" alt="静心帐篷" />
        </button>
        <div class="reward-particles" aria-hidden="true">
          <i style="--left: 2%; --drift: 28px; --fall: 78vh; --r: 240deg; --d: 0ms; --s: .78; --c: #fff1a6"></i>
          <i style="--left: 6%; --drift: -20px; --fall: 96vh; --r: -300deg; --d: 300ms; --s: 1.08; --c: #dff5ff"></i>
          <i style="--left: 10%; --drift: 34px; --fall: 88vh; --r: 320deg; --d: 120ms; --s: .9; --c: #fffdf4"></i>
          <i style="--left: 14%; --drift: -26px; --fall: 104vh; --r: -260deg; --d: 400ms; --s: .7; --c: #ffe06b"></i>
          <i style="--left: 18%; --drift: 18px; --fall: 72vh; --r: 280deg; --d: 210ms; --s: 1.16; --c: #fff1a6"></i>
          <i style="--left: 22%; --drift: -34px; --fall: 90vh; --r: -340deg; --d: 60ms; --s: .84; --c: #dff5ff"></i>
          <i style="--left: 26%; --drift: 26px; --fall: 99vh; --r: 300deg; --d: 420ms; --s: .96; --c: #fffdf4"></i>
          <i style="--left: 30%; --drift: -18px; --fall: 81vh; --r: -220deg; --d: 240ms; --s: .72; --c: #ffe06b"></i>
          <i style="--left: 34%; --drift: 32px; --fall: 94vh; --r: 360deg; --d: 30ms; --s: 1.12; --c: #fff1a6"></i>
          <i style="--left: 38%; --drift: -30px; --fall: 86vh; --r: -280deg; --d: 330ms; --s: .82; --c: #dff5ff"></i>
          <i style="--left: 42%; --drift: 20px; --fall: 102vh; --r: 250deg; --d: 180ms; --s: .92; --c: #fffdf4"></i>
          <i style="--left: 46%; --drift: -24px; --fall: 76vh; --r: -320deg; --d: 390ms; --s: 1.18; --c: #ffe06b"></i>
          <i style="--left: 50%; --drift: 30px; --fall: 91vh; --r: 340deg; --d: 90ms; --s: .76; --c: #fff1a6"></i>
          <i style="--left: 54%; --drift: -28px; --fall: 100vh; --r: -240deg; --d: 360ms; --s: 1.04; --c: #dff5ff"></i>
          <i style="--left: 58%; --drift: 24px; --fall: 84vh; --r: 290deg; --d: 150ms; --s: .88; --c: #fffdf4"></i>
          <i style="--left: 62%; --drift: -36px; --fall: 97vh; --r: -350deg; --d: 410ms; --s: .68; --c: #ffe06b"></i>
          <i style="--left: 66%; --drift: 18px; --fall: 74vh; --r: 230deg; --d: 45ms; --s: 1.14; --c: #fff1a6"></i>
          <i style="--left: 70%; --drift: -22px; --fall: 89vh; --r: -300deg; --d: 315ms; --s: .8; --c: #dff5ff"></i>
          <i style="--left: 74%; --drift: 36px; --fall: 103vh; --r: 370deg; --d: 195ms; --s: .98; --c: #fffdf4"></i>

          <i style="--left: 82%; --drift: 26px; --fall: 93vh; --r: 310deg; --d: 105ms; --s: 1.1; --c: #fff1a6"></i>
          <i style="--left: 86%; --drift: -18px; --fall: 98vh; --r: -330deg; --d: 345ms; --s: .86; --c: #dff5ff"></i>
          <i style="--left: 89%; --drift: 32px; --fall: 70vh; --r: 260deg; --d: 225ms; --s: .94; --c: #fffdf4"></i>
          <i style="--left: 92%; --drift: -34px; --fall: 87vh; --r: -290deg; --d: 405ms; --s: .7; --c: #ffe06b"></i>
          <i style="--left: 95%; --drift: 22px; --fall: 101vh; --r: 350deg; --d: 75ms; --s: 1.06; --c: #fff1a6"></i>
          <i style="--left: 97%; --drift: -28px; --fall: 82vh; --r: -250deg; --d: 285ms; --s: .78; --c: #dff5ff"></i>
          <i style="--left: 48%; --drift: 42px; --fall: 68vh; --r: 280deg; --d: 255ms; --s: .66; --c: #fffdf4"></i>
          <i style="--left: 72%; --drift: -40px; --fall: 106vh; --r: -360deg; --d: 135ms; --s: 1; --c: #ffe06b"></i>
        </div>
      </div>

      <section class="action-zone" id="actionZone"></section>
      <section class="task-rail" id="taskRail" aria-label="今日安排"></section>

      <nav class="bottom-nav" aria-label="主要导航">
        <img src="./assets/nav.png" alt="首页、日程、训练、奖励、目标、个人" />
      </nav>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>

      <dialog class="object-dialog" id="objectDialog">
        <button class="dialog-close" data-action="close-detail" aria-label="关闭">×</button>
        <img src="./assets/reward-bed.png" alt="静心帐篷" />
        <p>静心营地 · 第一阶段</p>
        <h2>静心帐篷</h2>
        <p class="object-story">由你本周完成的4次静心练习共同搭建，记录着逐渐稳定下来的下午节奏。</p>
        <dl>
          <div><dt>获得时间</dt><dd>2026年7月31日</dd></div>
          <div><dt>行为记录</dt><dd>冥想4次 · 共20分钟</dd></div>
        </dl>
      </dialog>
    </main>
    <script type="module" src="./src/app.js?v=20260731-2"></script>
  </body>
</html>

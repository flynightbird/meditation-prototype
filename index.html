<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2d1d16" />
    <title>成长基地 · 冥想闭环原型</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell" id="app" data-screen="recommendation">
      <div class="room" aria-hidden="true"></div>
      <video class="scene-video" id="sceneVideo" playsinline preload="auto" aria-hidden="true"></video>
      <div class="media-transition" id="mediaTransition" aria-hidden="true"></div>
      <div class="atmosphere" aria-hidden="true"></div>

      <button class="welcome-overlay" id="welcomeOverlay" type="button" aria-label="跳过欢迎动画" hidden>
        <span class="welcome-greeting" id="welcomeGreeting">下午好</span>
        <span class="welcome-streak" aria-hidden="true">
          <img src="./assets/streak.png" alt="" />
          <small>连续坚持</small>
          <strong>18</strong>
          <b>天</b>
        </span>
      </button>

      <header class="app-header">
        <div class="streak" id="streak">
          <img src="./assets/streak.png" alt="" />
          <span>连续坚持第18天</span>
        </div>
        <img class="capsule" src="./assets/capsule.png" alt="小程序菜单" />
      </header>

      <section class="message" id="message" aria-live="polite"></section>
      <section class="timer-panel" id="timerPanel" aria-live="polite"></section>

      <div class="character-stage">
        <img class="character" id="character" src="./assets/ip-meditate.png" alt="" />
        <button
          class="claim-reward"
          id="claimReward"
          type="button"
          data-action="claim-reward"
          aria-label="点击领取静心帐篷"
          hidden
        >
          <img src="./assets/reward-bed.png" alt="" />
          <span class="claim-label">点击领取</span>
        </button>
        <button class="reward-object" id="rewardObject" data-action="object-detail" aria-label="查看静心帐篷的获得记录">
          <span>NEW</span>
          <img src="./assets/reward-bed.png" alt="静心帐篷" />
        </button>
        <div class="reward-particles" aria-hidden="true">
          <i style="--x: -74px; --r: -34deg; --d: 0ms"></i>
          <i style="--x: -56px; --r: 28deg; --d: 40ms"></i>
          <i style="--x: -34px; --r: -18deg; --d: 90ms"></i>
          <i style="--x: -14px; --r: 42deg; --d: 20ms"></i>
          <i style="--x: 10px; --r: -26deg; --d: 110ms"></i>
          <i style="--x: 30px; --r: 34deg; --d: 70ms"></i>
          <i style="--x: 50px; --r: -38deg; --d: 130ms"></i>
          <i style="--x: 68px; --r: 22deg; --d: 50ms"></i>
          <i style="--x: -46px; --r: 48deg; --d: 150ms"></i>
          <i style="--x: 44px; --r: -44deg; --d: 170ms"></i>
        </div>
      </div>

      <section class="action-zone" id="actionZone"></section>
      <section class="task-rail" id="taskRail" aria-label="今日安排"></section>

      <nav class="bottom-nav" aria-label="主要导航">
        <img src="./assets/nav.png" alt="首页、日程、训练、奖励、目标、个人" />
      </nav>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>

      <dialog class="object-dialog" id="objectDialog">
        <button class="dialog-close" data-action="close-detail" aria-label="关闭">×</button>
        <img src="./assets/reward-bed.png" alt="静心帐篷" />
        <p>静心营地 · 第一阶段</p>
        <h2>静心帐篷</h2>
        <p class="object-story">由你本周完成的4次静心练习共同搭建，记录着逐渐稳定下来的下午节奏。</p>
        <dl>
          <div><dt>获得时间</dt><dd>2026年7月31日</dd></div>
          <div><dt>行为记录</dt><dd>冥想4次 · 共20分钟</dd></div>
        </dl>
      </dialog>
    </main>
    <script type="module" src="./src/app.js?v=20260731-2"></script>
  </body>
</html>
